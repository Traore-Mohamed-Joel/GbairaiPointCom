[project]
name = "gbairaipointcom"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joel traore", email = "mohamedjoeltraore@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.162.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
gbairaipointcom = "gbairaipointcom:main"

[build-system]
requires = ["uv-build>=0.12.15,<0.14.0"]
build-backend = "uv_build"