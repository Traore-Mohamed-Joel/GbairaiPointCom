
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord | GbairaiPointCom</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="dashboard-header">
        <h1>GbairaiPointCom</h1>
        <button id="logout-button">Déconnexion</button>
    </header>

    <main class="dashboard-container">
        <section class="welcome-section">
            <h2>Bienvenue sur ton espace !</h2>
            <p>Retrouve tes groupes et échange avec leurs membres.</p>
        </section>

        <section class="group-actions">
            <div class="dashboard-card">
                <h3>Créer un groupe</h3>

                <form id="create-group-form">
                    <label for="group-name">Nom du groupe</label>
                    <input
                        type="text"
                        id="group-name"
                        minlength="3"
                        maxlength="100"
                        required
                    >

                    <label for="group-description">Description</label>
                    <textarea id="group-description"></textarea>

                    <button type="submit">Créer le groupe</button>
                </form>
            </div>

            <div class="dashboard-card">
                <h3>Rejoindre un groupe</h3>

                <form id="join-group-form">
                    <label for="group-id">Identifiant du groupe</label>
                    <input type="number" id="group-id" min="1" required>

                    <button type="submit">Rejoindre</button>
                </form>
            </div>
        </section>

        <section class="my-groups">
            <h2>Mes groupes</h2>
            <div id="groups-list">
                Chargement des groupes...
            </div>
        </section>

        <p id="message" role="status"></p>
    </main>

    <script src="/static/js/dashboard.js"></script>
</body>
</html>
