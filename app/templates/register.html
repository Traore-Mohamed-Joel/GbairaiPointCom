 
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | GbairaiPointCom</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <h1>GbairaiPointCom</h1>
            <p>Rejoins tes groupes et échange avec ta communauté.</p>

            <h2>Créer un compte</h2>

            <form id="register-form">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username"
                       minlength="3" maxlength="50" required>

                <label for="email">Adresse email</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password"
                       minlength="8" maxlength="128" required>

                <button type="submit">Créer mon compte</button>
            </form>

            <p id="message" role="status"></p>

            <p>Déjà inscrit ?
                <a href="/login">Connecte-toi</a>
            </p>
        </section>
    </main>

    <script>
        document.getElementById("register-form").addEventListener("submit", async (event) => {
            event.preventDefault();

            const form = event.target;
            const message = document.getElementById("message");

            const data = {
                username: form.username.value,
                email: form.email.value,
                password: form.password.value
            };

            try {
                const response = await fetch("/auth/register", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    message.textContent = "Compte créé avec succès ! Tu peux maintenant te connecter.";
                    message.className = "success";
                    form.reset();
                } else {
                    message.textContent = result.detail || "Une erreur est survenue.";
                    message.className = "error";
                }
            } catch {
                message.textContent = "Impossible de contacter le serveur.";
                message.className = "error";
            }
        });
    </script>
</body>
</html>
